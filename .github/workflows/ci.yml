name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: servisflow_ci
          POSTGRES_USER: servisflow_ci
          POSTGRES_PASSWORD: servisflow_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servisflow_ci -d servisflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://servisflow_ci:servisflow_ci_password@localhost:5432/servisflow_ci?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy --workspace=@servisflow/api

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run integration tests
        run: npm run test:e2e

      - name: Build applications
        run: npm run build
